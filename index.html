<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1,maximum-scale=5" name="viewport" />
  <title>Video Cấp Tốc Toán 12 | Toán Cá Chép</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.youtube.com/iframe_api"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent:#F7C800; --accent-dark:#D4A800; --accent-bg:rgba(247,200,0,.08);
      --blue:#0040BE; --dark:#003B99; --light:#1E85EB; --cyan:#3C9EEF;
      --bg:#0a1128; --bg2:#0d1630; --card:#152040; --card-hover:#1a2850;
      --border:rgba(30,133,235,.2); --border-light:rgba(30,133,235,.1);
      --text:#ffffffde; --text2:#ffffff99; --text3:#ffffff52;
      --red:#eb5757; --green:#4dab6f;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
    html,body { width:100vw; height:100vh; overflow:hidden; font-family:'Inter','Manrope',system-ui,sans-serif; -webkit-tap-highlight-color:transparent }
    #tc-app {
      position:fixed; inset:0; z-index:9999;
      overflow-y:auto; overflow-x:hidden;
      background:var(--bg); color:var(--text); scroll-behavior:smooth;
    }

    /* ── TOPBAR ── */
    .topbar {
      position:sticky; top:0; z-index:200;
      background:var(--bg2); border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px; height:48px; gap:12px;
    }
    .topbar-brand span { font-weight:700; color:var(--text); font-size:14px; letter-spacing:-.2px }
    .topbar-brand small { display:block; font-size:10px; color:var(--accent); letter-spacing:.5px; margin-top:1px; font-weight:600 }
    .topbar-right { display:flex; gap:6px; align-items:center }
    .icon-btn {
      background:transparent; border:1px solid var(--border); color:var(--text2);
      cursor:pointer; font-size:15px; width:32px; height:32px; border-radius:6px;
      display:flex; align-items:center; justify-content:center; transition:all .15s;
    }
    .icon-btn:hover { background:var(--card-hover); color:var(--text) }
    .icon-btn.active { background:var(--accent); color:#000; border-color:var(--accent) }
    .prog-bar { position:fixed; top:48px; left:0; right:0; height:2px; background:var(--border); z-index:201 }
    .prog-fill { height:100%; background:var(--accent); width:0%; transition:width .15s }

    /* ── SEARCH ── */
    .search-wrap { padding:10px 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; gap:8px }
    .search-inp {
      flex:1; background:var(--card); border:1px solid var(--border); color:var(--text);
      border-radius:6px; padding:7px 12px; font-size:13px; font-family:inherit; outline:none; transition:border-color .15s;
    }
    .search-inp::placeholder { color:var(--text3) }
    .search-inp:focus { border-color:var(--accent) }
    .search-clear { background:none; border:none; color:var(--text3); cursor:pointer; font-size:14px; padding:0 4px; display:none }
    .search-clear.show { display:block }

    /* ── STATS ── */
    .stats-bar { background:var(--bg2); border-bottom:1px solid var(--border); padding:6px 20px; display:flex; gap:16px }
    .stat-item { font-size:12px; color:var(--text2); display:flex; align-items:center; gap:4px }
    .stat-item b { color:var(--accent) }

    /* ── CONTAINER + LAYOUT ── */
    .main-layout { display:flex; flex-direction:column }
    .player-col { display:none }
    .session-col { flex:1; overflow-y:auto }
    .session-list { padding:16px 16px 80px; max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:2px }

    /* ── SESSION ── */
    .session {
      background:var(--card); border:1px solid var(--border); border-radius:8px;
      overflow:hidden; transition:box-shadow .2s;
    }
    .session:hover { box-shadow:0 1px 8px rgba(0,0,0,.2) }
    .session.hidden { display:none }
    .sess-header {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; cursor:pointer; user-select:none; transition:background .1s;
    }
    .sess-header:hover { background:var(--card-hover) }
    .sess-num {
      font-size:12px; font-weight:700; color:#000;
      background:var(--accent); min-width:32px; text-align:center;
      padding:2px 8px; border-radius:4px;
    }
    .sess-title { font-weight:600; color:var(--text); font-size:13px; flex:1; line-height:1.4 }
    .sess-title.empty { color:var(--text3); font-style:italic; font-weight:400 }
    .sess-badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--accent-bg); color:var(--accent) }
    .sess-badge.soon { background:var(--border-light); color:var(--text3) }
    .sess-arrow { font-size:10px; color:var(--text3); transition:transform .2s }
    .session.open .sess-arrow { transform:rotate(90deg) }

    /* ── VIDEO LIST ── */
    .video-list { display:none; border-top:1px solid var(--border) }
    .session.open .video-list { display:block }
    .vitem {
      display:flex; align-items:center; gap:10px;
      padding:8px 14px 8px 24px; cursor:pointer;
      border-bottom:1px solid var(--border-light); transition:background .1s;
    }
    .vitem:last-child { border-bottom:none }
    .vitem:hover { background:var(--card-hover) }
    .vitem.playing { background:var(--accent-bg) }
    .vitem.watched { opacity:.5 }
    .vitem.hidden { display:none }
    .vplay {
      width:24px; height:24px; border-radius:50%; flex-shrink:0;
      background:var(--border); color:var(--text2); font-size:9px;
      display:flex; align-items:center; justify-content:center; font-weight:700; transition:all .15s;
    }
    .vitem:hover .vplay { background:var(--accent); color:#000 }
    .vitem.playing .vplay { background:var(--accent); color:#000 }
    .vitem.watched .vplay { background:var(--green); color:#fff }
    .vname { font-size:13px; color:var(--text); flex:1; line-height:1.4 }

    /* ── INLINE PLAYER ── */
    .inline-player { padding:4px 14px 8px }
    .inp-inner { background:var(--bg2); border:1px solid var(--border); border-radius:8px; overflow:hidden }
    .inp-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--card) }
    .inp-title { font-size:12px; font-weight:600; color:var(--text); flex:1; margin-right:8px }
    .inp-close {
      background:transparent; border:1px solid var(--border); color:var(--text2);
      cursor:pointer; font-size:12px; width:24px; height:24px; border-radius:4px;
      display:flex; align-items:center; justify-content:center;
    }
    .inp-wrap { position:relative; padding-top:56.25% }
    .inp-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none }

    /* ── DESKTOP PLAYER ── */
    @media (min-width:900px) {
      .main-layout { flex-direction:row!important; align-items:flex-start!important; gap:0 }
      .player-col {
        display:flex!important; width:72%!important; flex-shrink:0;
        flex-direction:column; position:sticky!important; top:48px;
        height:calc(100vh - 48px); overflow:hidden;
        border-right:1px solid var(--border); background:var(--bg);
      }
      .session-col { flex:1; overflow-y:auto; height:calc(100vh - 48px) }
      .session-list { max-width:none; margin:0; padding:12px 14px 80px }
    }
    .player-stage { position:relative; padding-top:56.25%; background:#000; flex-shrink:0 }
    #vid-placeholder {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:8px;
    }
    #vid-placeholder .ph-icon { font-size:36px }
    #vid-placeholder p { color:var(--text3); font-size:13px; text-align:center; padding:0 16px }
    #yt-player { position:absolute; inset:0 }
    .now-playing { padding:12px 16px; border-bottom:1px solid var(--border) }
    .np-session { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:.3px }
    .np-title { font-size:13px; color:var(--text); margin-top:4px; line-height:1.5; font-weight:500 }
    .player-controls { padding:8px 16px; display:flex; gap:6px; border-bottom:1px solid var(--border) }
    .ctrl-btn {
      background:transparent; border:1px solid var(--border); color:var(--text2);
      cursor:pointer; font-size:12px; font-family:inherit;
      padding:5px 12px; border-radius:6px; display:flex; align-items:center; gap:6px; transition:all .15s;
    }
    .ctrl-btn:hover { background:var(--card-hover); color:var(--text) }
    .ctrl-btn.active { background:var(--accent); color:#000; border-color:var(--accent) }
    .dot { width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block }

    /* ── NOTES ── */
    .notes-panel { flex:1; overflow:hidden; display:none; flex-direction:column; background:var(--bg2); border-top:1px solid var(--border) }
    .notes-panel.open { display:flex }
    .notes-header { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; font-size:12px; color:var(--text2) }
    .note-ts-btn { background:var(--accent-bg); border:1px solid var(--accent-dark); color:var(--accent); cursor:pointer; font-size:11px; padding:3px 8px; border-radius:4px; font-family:inherit }
    .notes-input {
      margin:6px 16px; padding:8px 10px; font-size:12px; font-family:inherit;
      background:var(--card); border:1px solid var(--border); color:var(--text);
      border-radius:6px; resize:none; height:56px; outline:none; flex-shrink:0;
    }
    .notes-input:focus { border-color:var(--accent) }
    .notes-save-btn {
      margin:0 16px 8px; padding:6px 12px; font-size:12px; font-weight:600; font-family:inherit;
      background:var(--accent); color:#000; border:none; border-radius:6px; cursor:pointer;
    }
    .notes-list { flex:1; overflow-y:auto; padding:0 16px 8px }
    .note-item { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-light) }
    .note-time { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600 }
    .note-text { font-size:12px; color:var(--text); flex:1; line-height:1.4 }
    .note-del { font-size:12px; color:var(--text3); cursor:pointer }
    .note-del:hover { color:var(--red) }
    .notes-empty { padding:12px 0; font-size:12px; color:var(--text3); font-style:italic }

    /* ── MISC ── */
    .top-btn {
      position:fixed; bottom:20px; right:16px; z-index:300;
      background:var(--accent); color:#000; border:none; border-radius:8px;
      width:36px; height:36px; font-size:16px; cursor:pointer;
      display:none; align-items:center; justify-content:center;
    }
    .top-btn.show { display:flex }
    .no-results { text-align:center; padding:40px 20px; color:var(--text3); font-size:14px; display:none }
    .no-results.show { display:block }
    .session { opacity:0; transform:translateY(8px); transition:opacity .3s, transform .3s }
    .session.visible { opacity:1; transform:none }

    /* ══ LIGHT THEME ══ */
    #tc-app.light {
      --bg:#ffffff; --bg2:#fbfbfa; --card:#ffffff; --card-hover:#f7f6f3;
      --border:#e5e5e3; --border-light:#f0efed;
      --text:#37352f; --text2:#787774; --text3:#c3c2bf;
    }
  </style>
</head>
<body>
<div id="tc-app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <span>⚡ CẤP TỐC TOÁN 12</span>
      <small>TOÁN CÁ CHÉP</small>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-autonext" onclick="toggleAutoNext()" title="Tự động tiếp theo">▶▶</button>
      <button class="icon-btn" id="btn-notes" onclick="toggleNotes()" title="Ghi chú">📝</button>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Đổi giao diện">🌙</button>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input class="search-inp" id="searchInp" placeholder="🔍 Tìm buổi học, video..." oninput="onSearch(this.value)" />
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item">📹 <b id="ts-video">...</b></div>
    <div class="stat-item">📅 <b id="ts-session">...</b></div>
    <div class="stat-item">✅ <b id="ts-watched">0% hoàn thành</b></div>
  </div>

  <!-- MAIN -->
  <div class="main-layout">

    <!-- LEFT: Desktop player -->
    <div class="player-col">
      <div class="player-stage">
        <div id="vid-placeholder">
          <div class="ph-icon">⚡</div>
          <p>Chọn một video từ danh sách →</p>
        </div>
        <div id="yt-player" style="display:none"></div>
      </div>
      <div class="now-playing">
        <div class="np-session" id="np-session">📌 CHƯA CHỌN BÀI</div>
        <div class="np-title" id="np-title">Chọn video từ danh sách bên phải →</div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" id="ctrl-autonext" onclick="toggleAutoNext()">
          <span class="dot"></span>Tự động tiếp theo
        </button>
        <button class="ctrl-btn" id="ctrl-notes" onclick="toggleNotes()">
          📝 Ghi chú
        </button>
      </div>
      <div class="notes-panel" id="notes-panel">
        <div class="notes-header">
          <span>📝 Ghi chú bài học</span>
          <button class="note-ts-btn" onclick="addTimestamp()">+ Thêm mốc thời gian</button>
        </div>
        <textarea class="notes-input" id="note-input" placeholder="Ghi chú của bạn..."></textarea>
        <button class="notes-save-btn" onclick="saveNote()">💾 LƯU GHI CHÚ</button>
        <div class="notes-list" id="notes-list"></div>
      </div>
    </div>

    <!-- RIGHT: Session list -->
    <div class="session-col">
      <div class="session-list" id="sessionList">
        <!-- rendered by JS -->
      </div>
      <div class="no-results" id="noResults">Không tìm thấy kết quả nào.</div>
    </div>

  </div><!-- /.main-layout -->

  <button class="top-btn" id="topBtn"
    onclick="document.getElementById('tc-app').scrollTo({top:0,behavior:'smooth'})">⬆️</button>

</div><!-- /#tc-app -->

<script>
  // ── DATA ──────────────────────────────────────────────────────────────────────
  // VIDEO-DATA-START
  const SESSIONS = [
  { num: "01", title: "KSCT Hà Nội - L1", videos: [{"name": "Phần 1", "id": "ITQ1eSigvyw"}] },
  { num: "02", title: "", videos: [] },
  { num: "03", title: "", videos: [] },
  { num: "04", title: "", videos: [] },
  { num: "05", title: "", videos: [] },
  { num: "06", title: "", videos: [] },
  { num: "07", title: "", videos: [] },
  { num: "08", title: "", videos: [] },
  { num: "09", title: "", videos: [] },
  { num: "10", title: "", videos: [] },
  { num: "11", title: "", videos: [] },
  { num: "12", title: "", videos: [] },
  { num: "13", title: "", videos: [] },
  { num: "14", title: "", videos: [] },
  { num: "15", title: "", videos: [] }
];
  // VIDEO-DATA-END

  // ── STATE ─────────────────────────────────────────────────────────────────────
  let watched    = JSON.parse(localStorage.getItem('tc-ct-watched') || '{}');
  let notes      = JSON.parse(localStorage.getItem('tc-ct-notes')   || '{}');
  let autoNext   = false;
  let activeItem = null;
  let currentVideoId = null;
  let inlinePlayer   = null;
  let ytPlayer, ytReady = false;
  const playQueue = [];

  // ── YOUTUBE API ───────────────────────────────────────────────────────────────
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      height:'100%', width:'100%',
      playerVars:{ rel:0, modestbranding:1, autoplay:1 },
      events:{
        onReady() { ytReady = true; },
        onStateChange(e) {
          if (e.data === YT.PlayerState.ENDED) {
            if (activeItem) markWatched(currentVideoId, activeItem);
            if (autoNext) playNext();
          }
          if (e.data === YT.PlayerState.PLAYING && activeItem) {
            markWatched(currentVideoId, activeItem);
          }
        }
      }
    });
  }

  function embedUrl(id) {
    return 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&modestbranding=1&autoplay=1';
  }

  // ── PLAY ──────────────────────────────────────────────────────────────────────
  function playVideo(id, name, sessionLabel, el) {
    closeInline(false);
    if (activeItem) activeItem.classList.remove('playing');
    el.classList.add('playing');
    activeItem = el; currentVideoId = id;

    if (window.innerWidth >= 900) {
      document.getElementById('vid-placeholder').style.display = 'none';
      const ypEl = document.getElementById('yt-player');
      ypEl.style.display = 'block';
      if (ytReady && ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(id);
      } else {
        ypEl.innerHTML = `<iframe src="${embedUrl(id)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"></iframe>`;
      }
      document.getElementById('np-session').textContent = '▶ ' + sessionLabel;
      document.getElementById('np-title').textContent = name;
      renderNotes();
    } else {
      markWatched(id, el);
      const div = document.createElement('div');
      div.className = 'inline-player';
      div.innerHTML = `<div class="inp-inner">
        <div class="inp-header">
          <span class="inp-title">${name}</span>
          <button class="inp-close" onclick="closeInline(true)">✕</button>
        </div>
        <div class="inp-wrap">
          <iframe src="${embedUrl(id)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>`;
      el.after(div);
      inlinePlayer = div;
      setTimeout(() => div.scrollIntoView({ behavior:'smooth', block:'nearest' }), 80);
    }
  }

  function playNext() {
    const idx = playQueue.findIndex(v => v.id === currentVideoId);
    if (idx >= 0 && idx < playQueue.length - 1) {
      const next = playQueue[idx + 1];
      const sessEl = next.el.closest('.session');
      if (sessEl && !sessEl.classList.contains('open')) toggleSession(sessEl);
      next.el.scrollIntoView({ behavior:'smooth', block:'nearest' });
      playVideo(next.id, next.name, next.session, next.el);
    }
  }

  function closeInline(clearActive = true) {
    if (inlinePlayer) { inlinePlayer.remove(); inlinePlayer = null; }
    if (clearActive && activeItem) {
      activeItem.classList.remove('playing');
      activeItem = null;
    }
  }

  // ── PROGRESS ──────────────────────────────────────────────────────────────────
  function markWatched(id, el) {
    if (!id || watched[id]) return;
    watched[id] = true;
    localStorage.setItem('tc-ct-watched', JSON.stringify(watched));
    if (el) {
      el.classList.add('watched');
      const vp = el.querySelector('.vplay');
      if (vp) vp.textContent = '✓';
    }
    updateStats();
  }

  function applyWatchedState() {
    Object.keys(watched).forEach(id => {
      document.querySelectorAll(`[data-vid="${id}"]`).forEach(el => {
        el.classList.add('watched');
        const vp = el.querySelector('.vplay');
        if (vp) vp.textContent = '✓';
      });
    });
  }

  function updateStats() {
    const total = playQueue.length;
    const done  = Object.keys(watched).length;
    const pct   = total > 0 ? Math.round(done / total * 100) : 0;
    const el    = document.getElementById('ts-watched');
    if (el) el.textContent = `${pct}% hoàn thành`;
  }

  // ── AUTO-NEXT ─────────────────────────────────────────────────────────────────
  function toggleAutoNext() {
    autoNext = !autoNext;
    document.getElementById('btn-autonext').classList.toggle('active', autoNext);
    document.getElementById('ctrl-autonext').classList.toggle('active', autoNext);
  }

  // ── NOTES ─────────────────────────────────────────────────────────────────────
  function toggleNotes() {
    const p = document.getElementById('notes-panel');
    const open = p.classList.toggle('open');
    document.getElementById('btn-notes').classList.toggle('active', open);
    document.getElementById('ctrl-notes').classList.toggle('active', open);
    if (open) renderNotes();
  }

  function addTimestamp() {
    const inp = document.getElementById('note-input');
    let ts = '0:00';
    if (ytReady && ytPlayer && ytPlayer.getCurrentTime) {
      const t = Math.floor(ytPlayer.getCurrentTime());
      ts = `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
    }
    inp.value = (inp.value ? inp.value + ' ' : '') + '[' + ts + '] ';
    inp.focus();
  }

  function saveNote() {
    const inp  = document.getElementById('note-input');
    const text = inp.value.trim();
    if (!text || !currentVideoId) return;
    let ts = 0, tsStr = '0:00';
    if (ytReady && ytPlayer && ytPlayer.getCurrentTime) {
      ts = Math.floor(ytPlayer.getCurrentTime());
      tsStr = `${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')}`;
    }
    if (!notes[currentVideoId]) notes[currentVideoId] = [];
    notes[currentVideoId].unshift({ ts, tsStr, text, date: Date.now() });
    localStorage.setItem('tc-ct-notes', JSON.stringify(notes));
    inp.value = '';
    renderNotes();
  }

  function deleteNote(videoId, idx) {
    if (notes[videoId]) {
      notes[videoId].splice(idx, 1);
      localStorage.setItem('tc-ct-notes', JSON.stringify(notes));
      renderNotes();
    }
  }

  function seekTo(ts) {
    if (ytReady && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(ts, true);
  }

  function renderNotes() {
    const list  = document.getElementById('notes-list');
    if (!list) return;
    const items = currentVideoId && notes[currentVideoId] ? notes[currentVideoId] : [];
    if (!items.length) {
      list.innerHTML = '<div class="notes-empty">Chưa có ghi chú cho bài này.</div>';
      return;
    }
    list.innerHTML = items.map((n, i) => `
      <div class="note-item">
        <span class="note-time" onclick="seekTo(${n.ts})" title="Nhảy đến ${n.tsStr}">[${n.tsStr}]</span>
        <span class="note-text">${n.text}</span>
        <span class="note-del" onclick="deleteNote('${currentVideoId}',${i})" title="Xóa">✕</span>
      </div>`).join('');
  }

  // ── BUILD SESSIONS ────────────────────────────────────────────────────────────
  function toggleSession(sessEl) {
    sessEl.classList.toggle('open');
  }

  function buildSessions() {
    const container = document.getElementById('sessionList');
    let totalV = 0;
    let html = '';

    SESSIONS.forEach((s, si) => {
      const hasVideos = s.videos.length > 0;
      const label = s.title ? `Buổi ${s.num} — ${s.title}` : `Buổi ${s.num}`;
      const badge = hasVideos
        ? `<span class="sess-badge">${s.videos.length} video</span>`
        : `<span class="sess-badge soon">Sắp có</span>`;
      const arrow = hasVideos ? `<span class="sess-arrow">▶</span>` : '';

      let vitems = '';
      s.videos.forEach((v, vi) => {
        const wCls  = watched[v.id] ? ' watched' : '';
        const wIcon = watched[v.id] ? '✓' : '▶';
        const sessionLabel = `Buổi ${s.num}${s.title ? ' — ' + s.title : ''}`;
        playQueue.push({ id: v.id, name: v.name, session: sessionLabel, el: null });
        totalV++;
        vitems += `<div class="vitem${wCls}" data-vid="${v.id}"
          onclick="playVideo('${v.id}','${v.name.replace(/'/g,"\'")}','${sessionLabel.replace(/'/g,"\'")}',this)">
          <div class="vplay">${wIcon}</div>
          <div class="vname">${v.name}</div>
        </div>`;
      });

      const vlist = hasVideos ? `<div class="video-list">${vitems}</div>` : '';
      const titleCls = s.title ? '' : ' empty';
      const displayTitle = s.title || '(chưa đặt tên)';

      html += `<div class="session" id="sess-${si}" data-num="${s.num}" data-title="${(s.title||'').toLowerCase()}">
        <div class="sess-header" onclick="toggleSession(this.closest('.session'))">
          <span class="sess-num">B${s.num}</span>
          <span class="sess-title${titleCls}">${displayTitle}</span>
          ${badge}${arrow}
        </div>
        ${vlist}
      </div>`;
    });

    container.innerHTML = html;

    // Backfill el references
    container.querySelectorAll('.vitem').forEach(el => {
      const vid = el.dataset.vid;
      const q = playQueue.find(v => v.id === vid && !v.el);
      if (q) q.el = el;
    });

    document.getElementById('ts-video').textContent   = totalV + ' video';
    document.getElementById('ts-session').textContent = SESSIONS.length + ' buổi';
    updateStats();
    applyWatchedState();

    // Scroll reveal
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold:0.05, root: document.querySelector('.session-col') || document.getElementById('tc-app') });
    document.querySelectorAll('.session').forEach(s => obs.observe(s));
  }

  buildSessions();

  // ── SEARCH ────────────────────────────────────────────────────────────────────
  function onSearch(q) {
    q = q.toLowerCase().trim();
    document.getElementById('searchClear').classList.toggle('show', q.length > 0);
    let anyVisible = false;

    document.querySelectorAll('.session').forEach(sessEl => {
      const num   = sessEl.dataset.num || '';
      const title = sessEl.dataset.title || '';
      const sessMatch = num.includes(q) || title.includes(q);

      let vidMatch = false;
      sessEl.querySelectorAll('.vitem').forEach(vEl => {
        const vname = vEl.querySelector('.vname')?.textContent.toLowerCase() || '';
        const show  = !q || sessMatch || vname.includes(q);
        vEl.classList.toggle('hidden', !show);
        if (show) vidMatch = true;
      });

      const show = !q || sessMatch || vidMatch;
      sessEl.classList.toggle('hidden', !show);
      if (show) anyVisible = true;

      // Auto-open sessions with matching videos when searching
      if (q && vidMatch && !sessMatch) sessEl.classList.add('open');
    });

    document.getElementById('noResults').classList.toggle('show', !anyVisible);
  }

  function clearSearch() {
    const inp = document.getElementById('searchInp');
    inp.value = '';
    onSearch('');
    inp.focus();
  }

  // ── SCROLL PROGRESS ───────────────────────────────────────────────────────────
  function updateProgress() {
    const app = document.getElementById('tc-app');
    const st  = app.scrollTop;
    const dH  = app.scrollHeight - app.clientHeight;
    document.getElementById('prog').style.width = (dH > 0 ? st / dH * 100 : 0) + '%';
    document.getElementById('topBtn').classList.toggle('show', st > 300);
  }
  document.getElementById('tc-app').addEventListener('scroll', updateProgress, { passive:true });
  updateProgress();

  // ── THEME ─────────────────────────────────────────────────────────────────────
  function toggleTheme() {
    const app = document.getElementById('tc-app');
    const btn = document.getElementById('themeToggle');
    const isLight = app.classList.toggle('light');
    btn.textContent = isLight ? '☀️' : '🌙';
    localStorage.setItem('tc-ct-theme', isLight ? 'light' : 'dark');
  }
  (function() {
    if (localStorage.getItem('tc-ct-theme') === 'light') {
      document.getElementById('tc-app').classList.add('light');
      document.getElementById('themeToggle').textContent = '☀️';
    }
  })();

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 900 && inlinePlayer) closeInline(true);
  });
</script>
</body>
</html>
