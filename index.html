    tailwind.config = {
      theme: {
        extend: {
          colors: {
            spacebg: '#000824',
            spacepanel: '#001a4d',

            accentlime: '#a8ff78',
            accentmagenta: '#ff0844',
            accentpurple: '#0040BE'
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          }
        }
      }

  <style>
    :root {
      --color-primary: #0040BE;
      --color-accent: #00f2fe;
      --color-neon-yellow: #f7c800;
    }

    body {
      background-color: #000824;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(255, 8, 68, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(168, 255, 120, 0.1) 0%, transparent 50%);
      color: white;
      position: relative;
      overflow-x: hidden;
    }

    /* Starry background effect */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.3;
      z-index: -1;
      animation: twinkle 4s infinite alternate;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 0.5; }
    }

    /* Sci-Fi UI Components */
    .toy-border {
      border: 2px solid var(--color-accent);
      border-radius: 1rem;
    }

    .toy-shadow {
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    .toy-card {
      background-color: #001a4d;
      border: 2px solid rgba(0, 64, 190, 0.5);
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
    }
    
    .toy-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 4px;
        background: #f7c800;
        z-index: 10;
    }

    .toy-button {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000824;
      border: none;
      border-radius: 9999px; /* pill shape */
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .toy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .toy-button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(0, 242, 254, 0.4);
    }

    /* Glassmorphism Topbar */
    .glass-panel {
      background: rgba(0, 8, 36, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Scrollbar styling for playlist */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 8, 36, 0.5);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(0, 64, 190, 0.7);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-accent);
    }

    /* Required Logic Classes for Playlist */
    .session {
      margin-bottom: 1.5rem;
    }
    
    .session-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #000824;
      background: #F7C800;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 10;
      text-shadow: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-title:hover {
      background: #ffdb33;
    }

    .session-items {
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .session.closed .session-items {
      display: none;
    }
    .session.closed .session-title .toggle-icon {
      transform: rotate(-90deg);
    }
    .session.empty {
      opacity: 1;
      transition: all 0.3s ease;
    }
    .session.empty .session-title {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.35);
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .session.empty .session-title:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
    }
    .session.empty .session-items .vitem {
      opacity: 0.35;
    }

    .vitem {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
      margin-right: 0.5rem; /* Thu gọn lại để không mất viền phải */
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .vitem:hover {
      transform: translateX(4px);
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 242, 254, 0.5);
    }

    /* Playing State */
    .vitem.playing {
      background: linear-gradient(90deg, rgba(0, 64, 190, 0.2), rgba(0, 242, 254, 0.2));
      border-color: #00f2fe;
      transform: translateX(4px);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .vitem.playing .vitem-title {
      font-weight: 700;
      color: #00f2fe;
    }

    .vitem.playing .status-icon {
      animation: pulse 1.5s infinite;
    }

    /* Watched State */
    .vitem.watched {
      background-color: rgba(0, 8, 36, 0.5);
      opacity: 0.8;
      border-style: solid;
      border-color: #00f2fe; /* nét liền xanh dương neon */
    }

    .vitem.watched .vitem-title {
      color: rgba(255,255,255,0.7); /* Bỏ gạch ngang */
    }

    .vitem.watched .status-indicator {
      background-color: #a8ff78;
      border-color: #a8ff78;
    }
    
    .vitem.watched .status-indicator::after {
      content: "✓";
      color: #000824;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .status-indicator {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .vitem.playing .status-indicator {
      background-color: #00f2fe;
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }
    
    .vitem.playing .status-indicator::after {
      content: "▶";
      color: #000824;
      font-size: 0.7rem;
      margin-left: 2px;
    }
    
    /* Inline player for mobile */
    .inline-player {
      width: 100%;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--color-accent);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
    .inline-player iframe {
      width: 100%;
      aspect-ratio: 16/9;
    }

    /* Empty State for Video Placeholder */
    .empty-state-icon {
      width: 80px;
      height: 80px;
      opacity: 0.25;
      margin-bottom: 1.5rem;
    }
    .empty-state-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }
    .empty-state-sub {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 0.5rem;
    }

    /* Toggle Switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.03em;
      transition: color 0.3s ease;
    }
    .toggle-wrap.active .toggle-label {
      color: #a8ff78;
    }
    .toggle-track {
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      position: relative;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .toggle-wrap.active .toggle-track {
      background: rgba(168, 255, 120, 0.3);
    }
    .toggle-wrap.active .toggle-track::after {
      left: 23px;
      background: #a8ff78;
      box-shadow: 0 0 8px rgba(168, 255, 120, 0.5);
    }
  </style>
</head>

];

  // ── STATE ─────────────────────────────────────────────────────────────────────
  let watched    = JSON.parse(localStorage.getItem('tc-ct-watched') || '{}');
  let autoNext   = false;
  let activeItem = null;
  let currentVideoId = null;
  let inlinePlayer   = null;
  let ytPlayer, ytReady = false;
  const playQueue = [];

  // ── YOUTUBE API ───────────────────────────────────────────────────────────────
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      height:'100%', width:'100%',
      playerVars:{ rel:0, modestbranding:1, autoplay:1 },
      events:{
        onReady() { ytReady = true; },
        onStateChange(e) {
          if (e.data === YT.PlayerState.ENDED) {
            if (activeItem) markWatched(currentVideoId, activeItem);
            if (autoNext) playNext();
          }
          if (e.data === YT.PlayerState.PLAYING && activeItem) {
            markWatched(currentVideoId, activeItem);
          }
        }
      }
    });
  }

  function embedUrl(id) {
    return 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&modestbranding=1&autoplay=1';
  }

  // ── PLAY ──────────────────────────────────────────────────────────────────────
  function playVideo(id, name, sessionLabel, desc, el) {
    closeInline(false);
    if (activeItem) activeItem.classList.remove('playing');
    el.classList.add('playing');
    activeItem = el; currentVideoId = id;

    if (window.innerWidth >= 1024) { // lg breakpoint in tailwind
      document.getElementById('vid-placeholder').style.display = 'none';
      const ypEl = document.getElementById('yt-player');
      ypEl.style.display = 'block';
      if (ytReady && ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(id);
      } else {
        ypEl.innerHTML = `<iframe src="${embedUrl(id)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"></iframe>`;
      }
      document.getElementById('np-session').textContent = sessionLabel;
      document.getElementById('np-title').textContent = name;
      document.getElementById('np-desc').textContent = desc || "Chúc bạn học tập hiệu quả!";
    } else {
      markWatched(id, el);
      const div = document.createElement('div');
      div.className = 'inline-player';
      div.innerHTML = `<iframe src="${embedUrl(id)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen frameborder="0"></iframe>`;
      el.after(div);
      inlinePlayer = div;
      setTimeout(() => div.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
    }
  }

  function playNext() {
    const idx = playQueue.findIndex(v => v.id === currentVideoId);
    if (idx >= 0 && idx < playQueue.length - 1) {
      const next = playQueue[idx + 1];
      const sessEl = next.el.closest('.session');
      if (sessEl && sessEl.classList.contains('closed')) toggleSession(sessEl.querySelector('.session-title'));
      next.el.scrollIntoView({ behavior:'smooth', block:'nearest' });
      playVideo(next.id, next.name, next.session, next.desc, next.el);
    }
  }

  function closeInline(clearActive = true) {
    if (inlinePlayer) { inlinePlayer.remove(); inlinePlayer = null; }
    if (clearActive && activeItem) {
      activeItem.classList.remove('playing');
      activeItem = null;
    }
  }

  // ── PROGRESS ──────────────────────────────────────────────────────────────────
  function markWatched(id, el) {
    if (!id || watched[id]) return;
    watched[id] = true;
    localStorage.setItem('tc-ct-watched', JSON.stringify(watched));
    if (el) {
      el.classList.add('watched');
    }
    updateStats();
  }

  function applyWatchedState() {
    Object.keys(watched).forEach(id => {
      document.querySelectorAll(`[data-vid="${id}"]`).forEach(el => {
        el.classList.add('watched');
      });
    });
  }

  function updateStats() {
    const total = playQueue.length;
    const done  = Object.keys(watched).length;
    const pct   = total > 0 ? Math.round(done / total * 100) : 0;
    const el    = document.getElementById('ts-watched-text');
    if (el) el.textContent = `Hoàn thành: ${pct}%`;
  }

  function toggleAutoNext() {
    autoNext = !autoNext;
    const wrap = document.getElementById('btn-autonext');
    if (autoNext) {
        wrap.classList.add('active');
    } else {
        wrap.classList.remove('active');
    }
  }

  // ── BUILD SESSIONS ────────────────────────────────────────────────────────────
  function toggleSession(titleEl) {
    const sessionEl = titleEl.closest('.session');
    sessionEl.classList.toggle('closed');
  }

  function buildSessions() {
    const container = document.getElementById('playlist-container');
    let totalV = 0;
    let html = '';

    SESSIONS.forEach((s, si) => {
      const hasVideos = s.videos.length > 0;
      const sessionLabel = s.title ? `Đề ${s.num} - ${s.title}` : `Đề ${s.num} - Đang cập nhật`;
      const icon = hasVideos ? "🚀" : "👽";
      
      let vitems = '';
      s.videos.forEach((v, vi) => {
        const sessionLabelFull = `Đề ${s.num}${s.title ? ' - ' + s.title : ''}`;
        playQueue.push({ id: v.id, name: v.name, session: sessionLabelFull, el: null, desc: v.desc });
        totalV++;
        
        vitems += `
          <div class="vitem" data-vid="${v.id}" onclick="playVideo('${v.id}','${v.name.replace(/'/g,"\\'")}', '${sessionLabelFull.replace(/'/g,"\\'")}', '${(v.desc || "").replace(/'/g,"\\'")}', this)">
            <div class="status-indicator"></div>
            <div class="flex flex-col">
              <span class="vitem-title font-body font-semibold text-base text-gray-200">${v.name}</span>
            </div>
          </div>`;
      });

      if (!hasVideos) {
        vitems = `
          <div class="vitem opacity-50 cursor-not-allowed">
            <div class="status-indicator"></div>
            <div class="flex flex-col">
              <span class="vitem-title font-body font-semibold text-base text-gray-400">Sắp có</span>
            </div>
          </div>`;
      }

      html += `
        <div class="session ${hasVideos ? '' : 'closed empty'}" id="session-${s.num}">
          <h4 class="session-title" onclick="toggleSession(this)">
            <span>${icon} ${sessionLabel}</span>
            <svg class="w-5 h-5 toggle-icon transition-transform ${hasVideos ? '' : '-rotate-90'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </h4>
          <div class="session-items flex flex-col pl-2 border-l-2 border-accentpurple/30 ml-4 mt-3">
            ${vitems}
          </div>
        </div>`;
    });

    container.innerHTML = html;

    // Backfill el references
    container.querySelectorAll('.vitem[data-vid]').forEach(el => {
      const vid = el.dataset.vid;
      const q = playQueue.find(v => v.id === vid && !v.el);
      if (q) q.el = el;
    });

    document.getElementById('ts-video-count').textContent = `${totalV} Videos`;
    updateStats();
    applyWatchedState();
  }

  buildSessions();

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024 && inlinePlayer) closeInline(true);
  });
</script>
</body>
</html>
